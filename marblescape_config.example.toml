[[layers]]
kind = "overlay"
name = "Coastlines"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "overlay"
name = "Boundaries"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "overlay"
name = "Labels (dark)"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "overlay"
name = "Labels (light)"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "overlay"
name = "Graticules (dark)"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "overlay"
name = "Graticules (light)"
enabled = false
opacity = 1.0
style = ""
